description: >-
  FinOps view of Sterling spend. Sterling (a First Advantage company) is a
  background and identity screening provider; cost is driven by the screenings
  you order rather than by API calls. Billing is quote-based and contractual -
  effectively per background check / per screening package, with per-check price
  varying by the products bundled (criminal, verifications, drug/health,
  identity, continuous monitoring) and the screening region (US, EMEA, Canada,
  APAC). The API is the ordering channel, not a separately metered product.
  Downstream passthrough fees (e.g., court access or verification fees) may add
  to Sterling's own charges.
notes: >-
  Per-unit rates are not public and are set by contract; verify with a Sterling /
  First Advantage representative. Because screenings are the cost driver,
  allocate spend by package, region, and the internal team / requisition that
  initiated each screening (map via clientReferenceId).
