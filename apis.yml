aid: sterling-check
url: https://raw.githubusercontent.com/api-evangelist/sterling-check/refs/heads/main/apis.yml
name: Sterling
kind: company
description: Sterling (Sterling Check Corp) is a global background and identity
  screening provider offering criminal checks, employment and education
  verifications, drug and health screening, identity verification, and continuous
  (recurring) monitoring. The Sterling API is a documented RESTful, OAuth2-secured
  developer API that lets platforms, ATS/HRIS systems, and marketplaces initiate
  background checks, manage candidates and screening packages, retrieve results and
  reports (PDF/HTML), send candidate invites, and receive real-time status updates
  via webhook callbacks. Access is gated - developers request a Client ID and Client
  Secret per screening region (US, EMEA, Canada, or APAC) - and the docs are
  published via a Postman-hosted portal at apidocs.sterlingcheck.app with a developer
  portal at developer.sterlingcheck.app. Sterling was acquired by First Advantage
  Corporation for $2.2 billion, with the deal closing on October 31, 2024; Sterling
  now operates as "a First Advantage company."
