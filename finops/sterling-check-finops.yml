meters:
- name: screenings
  description: Background screenings (orders) submitted, billed per check.
  unit: screenings
  aggregation: sum
  dimensions:
  - account
  - package
  - region
- name: report_items
  description: Individual screening products run within screenings; contribute to per-check price.
  unit: items
  aggregation: sum
  dimensions:
  - account
  - product
- name: continuous_monitoring
  description: Recurring / continuous screenings that re-run on a schedule to monitor candidates over time.
  unit: screenings
  aggregation: sum
  dimensions:
  - account
  - package
- name: passthrough_fees
  description: Downstream third-party fees (e.g., court access, verification fees) passed through on invoices.
  unit: charges
  aggregation: sum
  dimensions:
  - account
  - jurisdiction
principles:
- name: Visibility
  description: Track screening volume and product mix per package and region; reconcile passthrough fees separately.
- name: Allocation
  description: Tag each screening with a clientReferenceId so spend maps to the requisition, team, or cost center that initiated it.
- name: Optimization
  description: Use progressive/staged ordering to flag disqualifying results early and avoid paying for downstream products; right-size packages to the role.
- name: Accountability
  description: Assign owners per hiring program; review monthly screening spend and continuous-monitoring costs against budget.
